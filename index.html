<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maringotka MIMO – Rezervace</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0E3A2E;
  font-family:Inter,sans-serif;
  color:#F2E6D5;
}

.container{
  max-width:980px;
  margin:30px auto;
  padding:0 24px;
}

h2{
  font-size:58px;
  margin-bottom:28px;
}

.card{
  background:white;
  color:#111;
  border-radius:30px;
  padding:34px;
}

.calendar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px;
}

.calendar-header h3{
  margin:0;
  font-size:34px;
  text-transform:capitalize;
}

.nav-btn{
  width:52px;
  height:52px;
  border:none;
  border-radius:50%;
  background:#111;
  color:white;
  font-size:26px;
  cursor:pointer;
}

.weekdays,
.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:12px;
}

.weekdays{
  margin-bottom:12px;
}

.weekdays div{
  text-align:center;
  font-weight:600;
  color:#777;
}

.day{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#F3F3F3;
  border-radius:18px;
  font-size:28px;
  transition:.2s;
}

.day.empty{
  visibility:hidden;
}

.day.free:hover{
  background:#EADBC8;
}

.day.booked{
  background:#111;
  color:white;
}

/* příjezd */
.day.arrival{
  background:linear-gradient(135deg,#F3F3F3 0 50%,#111 50% 100%);
  color:white;
}

/* odjezd */
.day.departure{
  background:linear-gradient(135deg,#111 0 50%,#F3F3F3 50% 100%);
  color:white;
}

.legend{
  display:flex;
  gap:26px;
  flex-wrap:wrap;
  margin-top:26px;
  font-size:15px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:10px;
}

.legend-box{
  width:20px;
  height:20px;
  border-radius:6px;
  background:#F3F3F3;
}

.legend-box.booked{
  background:#111;
}

.legend-box.arrival{
  background:linear-gradient(135deg,#F3F3F3 0 50%,#111 50% 100%);
}

.legend-box.departure{
  background:linear-gradient(135deg,#111 0 50%,#F3F3F3 50% 100%);
}

form{
  display:grid;
  gap:16px;
  margin-top:34px;
}

input,
textarea{
  width:100%;
  padding:16px;
  border-radius:14px;
  border:1px solid #ddd;
  font-size:16px;
  font-family:inherit;
}

textarea{
  min-height:120px;
}

.submit{
  background:#14382E;
  color:white;
  border:none;
  border-radius:999px;
  padding:16px;
  font-size:17px;
  cursor:pointer;
}

@media(max-width:700px){

.container{
  padding:0 14px;
}

.card{
  padding:20px;
}

.calendar-header h3{
  font-size:26px;
}

.day{
  font-size:20px;
  border-radius:14px;
}

.weekdays,
.days{
  gap:8px;
}

.legend{
  gap:16px;
  font-size:14px;
}

}

</style>
</head>

<body>

<div class="container">

<h2>Dostupnost</h2>

<div class="card">

<div class="calendar-header">

<button id="prev" class="nav-btn">‹</button>

<h3 id="month"></h3>

<button id="next" class="nav-btn">›</button>

</div>

<div class="weekdays">
<div>Po</div>
<div>Út</div>
<div>St</div>
<div>Čt</div>
<div>Pá</div>
<div>So</div>
<div>Ne</div>
</div>

<div id="days" class="days"></div>

<div class="legend">

<div class="legend-item">
<div class="legend-box"></div>
Volno
</div>

<div class="legend-item">
<div class="legend-box booked"></div>
Obsazeno
</div>

<div class="legend-item">
<div class="legend-box arrival"></div>
Příjezd
</div>

<div class="legend-item">
<div class="legend-box departure"></div>
Odjezd
</div>

</div>

</div>

<div class="card" style="margin-top:28px;">

<h3>Požádat o rezervaci</h3>

<form action="https://api.web3forms.com/submit" method="POST">

<input type="hidden" name="access_key" value="4019eb80-3ffe-4332-b855-66a60eb5fb1f">

<input name="Jméno" placeholder="Jméno" required>

<input type="email" name="E-mail" placeholder="E-mail" required>

<input name="Telefon" placeholder="Telefon">

<textarea name="Poznámka" placeholder="Termín, počet osob nebo další informace"></textarea>

<button class="submit">Odeslat žádost</button>

</form>

</div>

</div>

<script>

let booked=[];
let arrival=[];
let departure=[];
let current=new Date();

const monthEl=document.getElementById("month");
const daysEl=document.getElementById("days");
const prevBtn=document.getElementById("prev");
const nextBtn=document.getElementById("next");

fetch("availability.json")
.then(r=>r.json())
.then(data=>{

booked=data.booked||[];
arrival=data.arrival||[];
departure=data.departure||[];

draw();

})
.catch(()=>draw());

function draw(){

daysEl.innerHTML="";

const year=current.getFullYear();
const month=current.getMonth();

monthEl.textContent=current.toLocaleDateString("cs-CZ",{
month:"long",
year:"numeric"
});

const first=new Date(year,month,1);
const offset=(first.getDay()+6)%7;
const total=new Date(year,month+1,0).getDate();

for(let i=0;i<offset;i++){

const e=document.createElement("div");
e.className="day empty";
daysEl.appendChild(e);

}

for(let d=1;d<=total;d++){

const date=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

const el=document.createElement("div");
el.className="day";
el.textContent=d;

if(booked.includes(date)){
el.classList.add("booked");
}else{
el.classList.add("free");
}

if(arrival.includes(date)){
el.classList.add("arrival");
}

if(departure.includes(date)){
el.classList.add("departure");
}

daysEl.appendChild(el);

}

}

prevBtn.onclick=()=>{

current.setMonth(current.getMonth()-1);
draw();

};

nextBtn.onclick=()=>{

current.setMonth(current.getMonth()+1);
draw();

};

</script>

</body>
</html>
