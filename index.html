<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maringotka MIMO – Rezervace</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box}

body{
  margin:0;
  background:#0E3A2E;
  font-family:Inter,sans-serif;
  color:#F2E6D5;
}

.container{
  max-width:980px;
  margin:30px auto;
  padding:0 24px;
}

h2{
  font-size:58px;
  margin-bottom:28px;
}

.card{
  background:white;
  color:#111;
  border-radius:30px;
  padding:34px;
}

.calendar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px;
}

.calendar-header h3{
  margin:0;
  font-size:34px;
  text-transform:capitalize;
}

.nav-btn{
  width:52px;
  height:52px;
  border:none;
  border-radius:50%;
  background:#111;
  color:white;
  font-size:26px;
  cursor:pointer;
}

.weekdays,
.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:12px;
}

.weekdays{
  margin-bottom:12px;
}

.weekdays div{
  text-align:center;
  font-weight:600;
  color:#777;
}

.day{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#F3F3F3;
  border-radius:18px;
  font-size:28px;
  transition:.2s;
  position:relative;
  overflow:hidden;
}

.day.empty{
  visibility:hidden;
}

.day.free{
  cursor:pointer;
}

.day.free:hover{
  background:#EADBC8;
}

.day.booked{
  background:#111;
  color:white;
}

.day.arrival{
  background:linear-gradient(135deg,#F3F3F3 0 50%,#111 50% 100%);
  color:white;
}

.day.departure{
  background:linear-gradient(135deg,#111 0 50%,#F3F3F3 50% 100%);
  color:white;
}

.day.selected{
  outline:3px solid #D9C8B0;
}

.legend{
  display:flex;
  gap:22px;
  margin-top:22px;
  flex-wrap:wrap;
  font-size:15px;
}

.legend-item{
  display:flex;
  align-items:center;
  gap:8px;
}

.legend-box{
  width:18px;
  height:18px;
  border-radius:5px;
}

.legend-booked{
  background:#111;
}

.legend-arrival{
  background:linear-gradient(135deg,#F3F3F3 0 50%,#111 50% 100%);
}

.legend-departure{
  background:linear-gradient(135deg,#111 0 50%,#F3F3F3 50% 100%);
}

form{
  display:grid;
  gap:14px;
  margin-top:22px;
}

input,
select,
textarea{
  width:100%;
  padding:16px;
  border-radius:14px;
  border:1px solid #ddd;
  font-size:16px;
  font-family:inherit;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.submit{
  background:#14382E;
  color:white;
  border:none;
  padding:16px;
  border-radius:999px;
  font-size:17px;
  cursor:pointer;
}

.submit:hover{
  opacity:.92;
}

@media(max-width:700px){

.container{
  padding:0 14px;
}

.card{
  padding:20px;
}

h2{
  font-size:42px;
}

.calendar-header h3{
  font-size:26px;
}

.day{
  font-size:20px;
  border-radius:14px;
}

.weekdays,
.days{
  gap:8px;
}

.nav-btn{
  width:44px;
  height:44px;
}

}

</style>
</head>
<body>

<div class="container">

<h2>Dostupnost</h2>

<div class="card">

<div class="calendar-header">
<button id="prev" class="nav-btn">‹</button>
<h3 id="month"></h3>
<button id="next" class="nav-btn">›</button>
</div>

<div class="weekdays">
<div>Po</div>
<div>Út</div>
<div>St</div>
<div>Čt</div>
<div>Pá</div>
<div>So</div>
<div>Ne</div>
</div>

<div id="days" class="days"></div>

<div class="legend">

<div class="legend-item">
<div class="legend-box legend-booked"></div>
Obsazeno
</div>

<div class="legend-item">
<div class="legend-box legend-arrival"></div>
Příjezd
</div>

<div class="legend-item">
<div class="legend-box legend-departure"></div>
Odjezd
</div>

</div>

</div>

<div class="card" style="margin-top:30px;">

<h3 style="margin-top:0;font-size:34px;">Požádat o rezervaci</h3>

<form action="https://api.web3forms.com/submit" method="POST">

<input type="hidden" name="access_key" value="4019eb80-3ffe-4332-b855-66a60eb5fb1f">

<input type="hidden" name="subject" value="Nová žádost o rezervaci – Maringotka MIMO">

<input type="text" name="Jméno" placeholder="Jméno a příjmení" required>

<input type="email" name="E-mail" placeholder="E-mail" required>

<input type="tel" name="Telefon" placeholder="Telefon">

<input id="arrivalInput" name="Příjezd" placeholder="Příjezd" required>

<input id="departureInput" name="Odjezd" placeholder="Odjezd" required>

<select name="Počet osob">
<option value="1">1 osoba</option>
<option value="2" selected>2 osoby</option>
</select>

<textarea name="Poznámka" placeholder="Napište nám cokoliv – například přibližný čas příjezdu nebo dotaz."></textarea>

<button class="submit">Odeslat žádost</button>

</form>

</div>

</div>

<script>

let booked=[];
let arrival=[];
let departure=[];
let current=new Date();

let selectedArrival=null;
let selectedDeparture=null;

const monthEl=document.getElementById("month");
const daysEl=document.getElementById("days");
const prevBtn=document.getElementById("prev");
const nextBtn=document.getElementById("next");

const arrivalInput=document.getElementById("arrivalInput");
const departureInput=document.getElementById("departureInput");

fetch("availability.json")
.then(r=>r.json())
.then(data=>{
booked=data.booked||[];
arrival=data.arrival||[];
departure=data.departure||[];
draw();
})
.catch(()=>draw());

function draw(){

daysEl.innerHTML="";

const year=current.getFullYear();
const month=current.getMonth();

monthEl.textContent=current.toLocaleDateString("cs-CZ",{month:"long",year:"numeric"});

const first=new Date(year,month,1);
const offset=(first.getDay()+6)%7;
const total=new Date(year,month+1,0).getDate();

for(let i=0;i<offset;i++){
const e=document.createElement("div");
e.className="day empty";
daysEl.appendChild(e);
}

for(let d=1;d<=total;d++){

const date=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

const el=document.createElement("div");
el.className="day";
el.textContent=d;

if(booked.includes(date)){

el.classList.add("booked");

if(arrival.includes(date)) el.classList.add("arrival");
if(departure.includes(date)) el.classList.add("departure");

}else{

el.classList.add("free");

el.onclick=()=>selectDate(date);

}

if(date===selectedArrival||date===selectedDeparture){
el.classList.add("selected");
}

daysEl.appendChild(el);

}

}

function selectDate(date){

if(!selectedArrival||selectedDeparture){

selectedArrival=date;
selectedDeparture=null;

arrivalInput.value=format(date);
departureInput.value="";

}else{

if(date>selectedArrival){

selectedDeparture=date;
departureInput.value=format(date);

}else{

selectedArrival=date;
selectedDeparture=null;

arrivalInput.value=format(date);
departureInput.value="";

}

}

draw();

}

function format(date){

const d=new Date(date);

return d.toLocaleDateString("cs-CZ",{
day:"numeric",
month:"numeric",
year:"numeric"
});

}

prevBtn.onclick=()=>{
current.setMonth(current.getMonth()-1);
draw();
};

nextBtn.onclick=()=>{
current.setMonth(current.getMonth()+1);
draw();
};

</script>

</body>
</html>
