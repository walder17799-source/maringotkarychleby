<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIMO – Rezervace</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{
font-family:Inter,sans-serif;
margin:30px;
background:#fff;
color:#111;
}

.calendar{
max-width:720px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:24px;
}

.header h2{
font-size:30px;
margin:0;
}

button.nav{
width:42px;
height:42px;
border-radius:999px;
border:1px solid #ddd;
background:white;
cursor:pointer;
}

.weekdays,.days{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;
}

.weekdays div{
text-align:center;
font-size:14px;
color:#777;
font-weight:600;
}

.day{
aspect-ratio:1;
display:flex;
align-items:center;
justify-content:center;
border:1px solid #ececec;
border-radius:16px;
}

.free:hover{
border-color:#111;
cursor:pointer;
}

.booked{
background:#111;
color:white;
border-color:#111;
}

.empty{
visibility:hidden;
}

.selected{
background:#EADBC8;
border-color:#EADBC8;
}

.range{
background:#F4EFE8;
}

form{
max-width:720px;
margin:50px auto;
display:grid;
gap:14px;
}

input,textarea{
padding:14px;
border-radius:14px;
border:1px solid #ddd;
font-size:16px;
}

button.submit{
padding:16px;
border:none;
border-radius:999px;
background:#14382E;
color:white;
font-weight:600;
cursor:pointer;
}
</style>
</head>

<body>

<div class="calendar">

<div class="header">
<button id="prev" class="nav">‹</button>
<h2 id="month"></h2>
<button id="next" class="nav">›</button>
</div>

<div class="weekdays">
<div>Po</div><div>Út</div><div>St</div><div>Čt</div><div>Pá</div><div>So</div><div>Ne</div>
</div>

<div id="days" class="days"></div>

</div>

<form action="https://api.web3forms.com/submit" method="POST">

<input type="hidden" name="access_key" value="4019eb80-3ffe-4332-b855-66a60eb5fb1f">

<input name="Jméno" placeholder="Jméno" required>

<input name="E-mail" type="email" placeholder="E-mail" required>

<input name="Telefon" placeholder="Telefon">

<input id="arrival" name="Příjezd" placeholder="Příjezd" readonly required>

<input id="departure" name="Odjezd" placeholder="Odjezd" readonly required>

<textarea name="Poznámka" placeholder="Poznámka"></textarea>

<button class="submit">Odeslat žádost</button>

</form>

<script>
let booked=[];
let current=new Date();

const month=document.getElementById("month");
const days=document.getElementById("days");

let startDate=null;
let endDate=null;

fetch("availability.json")
.then(r=>r.json())
.then(data=>{
booked=data;
draw();
});

function draw(){

days.innerHTML="";

const y=current.getFullYear();
const m=current.getMonth();

month.textContent=current.toLocaleDateString("cs-CZ",{month:"long",year:"numeric"});

const first=new Date(y,m,1);
const start=(first.getDay()+6)%7;
const total=new Date(y,m+1,0).getDate();

for(let i=0;i<start;i++){
const e=document.createElement("div");
e.className="day empty";
days.appendChild(e);
}

for(let d=1;d<=total;d++){

const el=document.createElement("div");

const date=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

el.textContent=d;

if(booked.includes(date)){
el.className="day booked";
}else{
el.className="day free";
el.onclick=()=>select(date);
}

days.appendChild(el);
}
}

function select(date){

if(!startDate||endDate){
startDate=date;
endDate=null;
arrival.value=date;
departure.value="";
return;
}

if(date>startDate){
endDate=date;
departure.value=date;
}
}

prev.onclick=()=>{current.setMonth(current.getMonth()-1);draw();}
next.onclick=()=>{current.setMonth(current.getMonth()+1);draw();}
</script>

</body>
</html>
