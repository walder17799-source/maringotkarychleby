<script>
const monthEl = document.getElementById("month");
const daysEl = document.getElementById("days");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");

let current = new Date(2026, 7, 1); // srpen 2026 jako výchozí
let booked = [];
let arrival = [];
let departure = [];

// Načti availability.json
fetch("./availability.json")
  .then(r => r.json())
  .then(data => {
    booked = data.booked || [];
    arrival = data.arrival || [];
    departure = data.departure || [];
    draw();
  })
  .catch(err => {
    console.error("Chyba načtení availability.json:", err);
  });

function draw() {
  daysEl.innerHTML = "";

  const year = current.getFullYear();
  const month = current.getMonth();

  monthEl.textContent = current.toLocaleDateString("cs-CZ", {
    month: "long",
    year: "numeric"
  });

  const first = new Date(year, month, 1);
  const offset = (first.getDay() + 6) % 7;
  const total = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < offset; i++) {
    const e = document.createElement("div");
    e.className = "day empty";
    daysEl.appendChild(e);
  }

  for (let d = 1; d <= total; d++) {

    const date =
      `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

    const el = document.createElement("div");
    el.className = "day";
    el.textContent = d;

    const isBooked = booked.includes(date);
    const isArrival = arrival.includes(date);
    const isDeparture = departure.includes(date);

    if (isArrival && isDeparture) {
      el.classList.add("booked");
    } else if (isArrival) {
      el.classList.add("arrival");
    } else if (isDeparture) {
      el.classList.add("departure");
    } else if (isBooked) {
      el.classList.add("booked");
    } else {
      el.classList.add("free");
    }

    daysEl.appendChild(el);
  }
}

prevBtn.onclick = () => {
  current.setMonth(current.getMonth() - 1);
  draw();
};

nextBtn.onclick = () => {
  current.setMonth(current.getMonth() + 1);
  draw();
};
</script>
