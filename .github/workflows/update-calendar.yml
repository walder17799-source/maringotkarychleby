name: Update Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download iCal
        run: |
          curl -L "https://www.e-chalupy.cz/api/calendar/23815/AE523079fdAC6B1/default.ics" -o calendar.ics

      - name: Convert to JSON
        run: |
          python3 <<'PY'
          import json
          import re
          from datetime import datetime, timedelta

          text=open("calendar.ics",encoding="utf-8").read()

          booked=set()
          arrivals=set()
          departures=set()

          for ev in text.split("BEGIN:VEVENT")[1:]:

              s=re.search(r"DTSTART[^:]*:(\d{8})",ev)
              e=re.search(r"DTEND[^:]*:(\d{8})",ev)

              if not s or not e:
                  continue

              start=datetime.strptime(s.group(1),"%Y%m%d")
              end=datetime.strptime(e.group(1),"%Y%m%d")

              arrivals.add(start.strftime("%Y-%m-%d"))
              departures.add((end-timedelta(days=1)).strftime("%Y-%m-%d"))

              d=start
              while d<end:
                  booked.add(d.strftime("%Y-%m-%d"))
                  d+=timedelta(days=1)

          with open("availability.json","w") as f:
              json.dump({
                  "booked":sorted(booked),
                  "arrival":sorted(arrivals),
                  "departure":sorted(departures)
              },f,indent=2)
          PY

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add availability.json

          git diff --cached --quiet || git commit -m "Update availability"

          git push
